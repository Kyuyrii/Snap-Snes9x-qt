name: snes9x-qt
base: core24
#version: '1.63'
adopt-info: snes9x-qt-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: A Super Nintendo emulator
description: |
  Snes9x is a portable, freeware Super Nintendo Entertainment System (SNES) emulator.
  It basically allows you to play most games designed for the SNES and Super Famicom Nintendo game systems on your PC or Workstation; which includes some real gems that were only ever released in Japan.
grade: stable
confinement: strict
icon: snes9x.svg

apps:
  snes9x-qt:
    command-chain: [force-snap-common-folder]
    command: usr/bin/snes9x-qt
    desktop: snes9x-qt.desktop
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
    extensions: [kde-neon-6]
    plugs:
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2

plugs:
  shared-memory:
    private: true

parts:
  snes9x-qt-app:
    plugin: cmake
    source: https://github.com/snes9xgit/snes9x.git
#    source-tag: $SNAPCRAFT_PROJECT_VERSION
    source-subdir: qt
    build-packages:
      - libsdl2-dev
      - libpng-dev
      - gettext
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    override-build: |
      craftctl default
      craftctl set version=$(date +%Y-%m-%d)

  dependencies:
    after: [snes9x-qt-app]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libdecor-0-0
    prime:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libSDL2-2.0.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor-0.so*

  other-files:
    after: [dependencies]
    plugin: dump
    source: ./other-files
