name: snes9x-qt
base: core24
version: '1.63'
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: A Super Nintendo emulator
description: |
  Snes9x is a portable, freeware Super Nintendo Entertainment System (SNES) emulator.
  It basically allows you to play most games designed for the SNES and Super Famicom Nintendo game systems on your PC or Workstation; which includes some real gems that were only ever released in Japan.
grade: stable
confinement: strict
icon: snes9x.svg

apps:
  snes9x-qt:
    command-chain: [snap/command-chain/qt_qpa_platform-xcb]
    command: usr/bin/snes9x-qt
    desktop: meta/gui/snes9x-qt.desktop
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      LD_LIBRARY_PATH: $SNAP/lxqt-support-core24/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
      QT_PLUGIN_PATH: $SNAP/lxqt-support-core24/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$QT_PLUGIN_PATH
    extensions: [kde-neon-6]
    plugs:
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2

plugs:
  shared-memory:
    private: true
  lxqt-support-core24:
    content: lxqt-support-core24
    interface: content
    target: $SNAP/lxqt-support-core24
    default-provider: lxqt-support-core24

layout:
  /usr/share/color-schemes:
    symlink: $SNAP/lxqt-support-core24/usr/share/color-schemes
  /usr/share/Kvantum:
    symlink: $SNAP/lxqt-support-core24/usr/share/Kvantum

package-repositories:
  - type: apt
    url: http://origin.archive.neon.kde.org/user
    suites: [noble]
    components: [main]
    architectures: [amd64, arm64]
    key-id: 444DABCF3667D0283F894EDDE6D4736255751E5D

parts:
  snes9x:
    plugin: cmake
    source: https://github.com/snes9xgit/snes9x.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    source-subdir: qt
    build-packages:
      - libsdl2-dev
      - libpng-dev
      - gettext
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr

  dependencies:
    after: [snes9x]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libdecor-0-0
    prime:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libSDL2-2.0.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor-0.so*

  command-chain-and-desktop:
    after: [dependencies]
    plugin: dump
    source: ./
    organize:
      command-chain/qt_qpa_platform-xcb: snap/command-chain/qt_qpa_platform-xcb
      snes9x-qt.desktop: meta/gui/snes9x-qt.desktop
    prime:
      - snap/command-chain/qt_qpa_platform-xcb
      - meta/gui/snes9x-qt.desktop
